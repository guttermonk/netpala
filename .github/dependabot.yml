version: 2
updates:
  # No HTTP client here, but netpala parses input it does not control: SSIDs
  # off the air and replies over D-Bus. go.mod is the only manifest.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Every go.sum change needs flake.nix's vendorHash moved by hand, and
    # dependabot has no idea flake.nix exists -- so each separate PR is
    # another commit I have to write before the nix job will go green. One
    # PR for everything short of a major keeps that to once a week. Majors
    # still arrive alone, where the hash is the least of what wants reading.
    groups:
      non-major:
        update-types:
          - "patch"
          - "minor"

  # Nothing here touches go.sum, so there is no vendorHash to chase and no
  # reason to group these.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
