# Netpala Configuration File
# 
# This is an example configuration file showing all available keybindings.
# Copy this file to ~/.config/netpala/config.toml to customize your keybindings.
#
# Available modifiers: ctrl, alt, shift
# Examples: "ctrl+c", "shift+tab", "alt+enter", "a", "up", "down", "left", "right"
# Special keys: enter, space (use " "), tab, backspace, delete, esc, up, down, left, right
# Multiple keys can be assigned to the same action.

[keybindings]

# Navigation - Move up in the current list
[keybindings.up]
keys = ["k", "up"]
help = "Up"

# Navigation - Move down in the current list
[keybindings.down]
keys = ["j", "down"]
help = "Down"

# Navigation - Move to the next pane/section
[keybindings.next_pane]
keys = ["tab"]
help = "Next"

# Navigation - Move to the previous pane/section
[keybindings.prev_pane]
keys = ["shift+tab"]
help = "Prev"

# Actions - Select/Connect to network or toggle VPN/WiFi
[keybindings.select]
keys = ["enter", " "]
help = "Dis/Connect"

# Actions - Remove/forget a saved network
[keybindings.remove]
keys = ["backspace", "delete"]
help = "Remove"

# Actions - Trigger a network scan
[keybindings.scan]
keys = ["s"]
help = "Scan"

# Actions - Toggle auto-connect for a known network
[keybindings.toggle_autoconnect]
keys = ["a"]
help = "Auto"

# Actions - Toggle hidden status for a known network
[keybindings.toggle_hidden]
keys = ["h"]
help = "Hidden"

# Actions - Open the DNS provider switcher for a known network
[keybindings.set_dns]
keys = ["d"]
help = "DNS"

# Actions - Open the MAC address switcher for a known network
[keybindings.set_mac]
keys = ["m"]
help = "MAC"

# Actions - Import a wg-quick WireGuard config as a NetworkManager profile.
# Works from any pane: the VPN pane hides itself while it is empty, which is
# where you are when importing your first tunnel.
[keybindings.import_vpn]
keys = ["i"]
help = "Import"

# Application - Quit the application
[keybindings.quit]
keys = ["q", "ctrl+c", "ctrl+q", "ctrl+w"]
help = "Quit"

# Application - Cancel current operation/close popup
[keybindings.cancel]
keys = ["esc"]
help = "Cancel"

# DNS Switcher Configuration
#
# Where a local DNSCrypt proxy (dnscrypt-proxy, stubby, etc) listens.
# It MUST be on port 53 — /etc/resolv.conf has no syntax for a port, so a
# proxy on 127.0.0.1:5353 cannot be used here.
# netpala does not run the proxy; it only points the connection profile at it.

[dns]
dnscrypt_addresses = ["127.0.0.1"]

# Security Pane Configuration
#
# systemd units shown in the Security pane and toggled with the select key.
# Units that are not installed on this system are skipped, and the pane hides
# itself entirely when nothing is left -- so listing one costs nothing.
#
# Toggling requires a polkit rule permitting
# org.freedesktop.systemd1.manage-units for that unit. Without one you get a
# clear error rather than a password prompt. See contrib/tor-transparent/.
#
# state_file (optional) records "on"/"off" after a successful toggle so a
# boot-time unit can replay the choice. NixOS cannot use `systemctl enable`
# for this: /etc/systemd/system is a read-only symlink into the Nix store.

[[security.services]]
name = "Tor"
unit = "tor-transparent.service"
state_file = "/var/lib/netpala/tor"

# provides_dns marks a unit that answers DNS on loopback. Stopping one while a
# saved network points its DNS at 127.0.0.1 takes out name resolution, so
# netpala names the affected networks and makes you press select twice.
[[security.services]]
name = "DNSCrypt"
unit = "dnscrypt-proxy2.service"
provides_dns = true

[[security.services]]
name = "I2P"
unit = "i2pd.service"

# VPN Provider Configuration
#
# Vendor VPN daemons shown in the VPN pane beside NetworkManager profiles.
# A provider whose unit is not installed is skipped, so listing one costs
# nothing.
#
# These exist because vendor daemons have no D-Bus API: starting
# mullvad-daemon connects nothing, `mullvad connect` does. This is the ONLY
# place netpala runs an external command — everything else goes over D-Bus.
#
#   connect/disconnect are argv arrays, never shell strings. Nothing is
#   word-split or interpolated, so a value containing ";" or "$(...)" is an
#   argument rather than a second command. Commands are given 30 seconds; one
#   that waits for input (`tailscale up` on an unauthenticated node prints a
#   URL and blocks) is killed rather than hanging the UI.
#
#   interface is how netpala tells "connected" from "the daemon is running",
#   which are not the same thing. The row is marked connected when that
#   interface exists and is up. That is exact for a provider which creates its
#   device on connect and removes it on disconnect — Mullvad works this way.
#   A provider that keeps its interface around whenever the daemon runs will
#   read as connected whenever the daemon runs, which is why only Mullvad
#   ships as a default.
#
# netpala cannot see how these route, since they use a firewall mark and a
# policy rule rather than NetworkManager, so it makes no claim about whether
# such a tunnel is carrying your traffic.

[[vpn.providers]]
name       = "Mullvad"
unit       = "mullvad-daemon.service"
interface  = "wg0-mullvad"
connect    = ["mullvad", "connect"]
disconnect = ["mullvad", "disconnect"]

# Tailscale, as an example of one to add yourself. Not a default: tailscale0
# exists whenever tailscaled runs, so the row would read connected even after
# `tailscale down`.
#
# [[vpn.providers]]
# name       = "Tailscale"
# unit       = "tailscaled.service"
# interface  = "tailscale0"
# connect    = ["tailscale", "up"]
# disconnect = ["tailscale", "down"]

# Color Configuration
# 
# Customize the application colors using hex color codes (e.g., "#ffffff")
# You can also use terminal color names (e.g., "red", "blue", "green")
# or ANSI color numbers (e.g., "1" for red, "2" for green)
#
# Default color scheme:

[colors]
# Default text and UI elements
primary = "#a7abca"        # Light blue-gray

# Active/selected borders
active = "#9cca69"         # Green

# Active/selected text
active_text = "#cda162"    # Orange

# Selection bar background
selection_bg = "#5a6988"   # Darker blue-gray

# Inactive/dimmed elements
inactive = "#444a66"       # Dark gray

# Error states
error = "#ff0000"          # Red

# Error text
error_text = "#aa0000"     # Dark red

# Helper text at the bottom of the window
help_text = "#a7abca"      # Light blue-gray

# Example text inside an empty input box, such as the file path shown when
# importing a WireGuard config.
#
# Its own setting because it has to be dim enough to read as "not what you
# typed" and bright enough to actually read, and where that lands depends on
# your terminal background. Raise it towards primary if it is hard to see
# against yours; lower it towards inactive if it looks like real input.
placeholder = "#8a90b8"    # Muted blue-gray
